<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist</title>
    <style>
        .w {
            max-width: 640px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            padding: 12px;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back {
            display: flex;
            padding: 12px 0;
            gap: 12px;
            justify-content: space-between;
            font-size: 16px;
        }

        a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        a:hover {
            text-decoration: underline;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            /* 👈 关键：固定列宽布局 */
            min-width: 500px;
        }

        th,
        td {
            padding: 10px 1px;
            text-align: left;
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 固定三列比例：50% / 25% / 25% */
        th:nth-child(1),
        td:nth-child(1) {
            width: 50%;
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 25%;
        }

        th:nth-child(3),
        td:nth-child(3) {
            width: 25%;
        }

        th {
            font-weight: bold;
        }

        .loading,
        .loading-more {
            text-align: center;
            padding: 20px 0;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .back {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            th,
            td {
                padding: 8px 1px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="w">
        <div class="container">
            <div class="back">
                <a href="..">..</a>
            </div>
            <h1>Playlist</h1>

            <div class="table-wrapper">
                <table id="song-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Singer</th>
                            <th>Album</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- 歌曲将追加到这里 -->
                    </tbody>
                </table>
            </div>

            <div id="loading-more" class="loading-more" style="display:none;">Loading more...</div>
            <div id="no-more" class="loading-more" style="display:none;">No more songs</div>
        </div>
    </div>

    <script>
        const PLAYLIST_ID = '327175538';
        const LIMIT = 30;
        let currentPage = 0;
        let hasNextPage = true;
        let isLoading = false;

        const API_BASE = 'https://apis.netstart.cn/music/playlist/track/all';
        const tableBody = document.getElementById('table-body');
        const loadingMoreEl = document.getElementById('loading-more');
        const noMoreEl = document.getElementById('no-more');

        // 初始加载
        loadNextPage();

        window.addEventListener('scroll', () => {
            if (!hasNextPage || isLoading) return;
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
                loadNextPage();
            }
        });

        async function loadNextPage() {
            if (isLoading || !hasNextPage) return;

            isLoading = true;
            loadingMoreEl.style.display = 'block';
            noMoreEl.style.display = 'none';

            currentPage += 1;
            const offset = (currentPage - 1) * LIMIT;
            const url = `${API_BASE}?id=${PLAYLIST_ID}&limit=${LIMIT}&offset=${offset}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network request failed');

                const data = await response.json();
                if (!data || !Array.isArray(data.songs)) {
                    throw new Error('Invalid response format');
                }

                const songs = data.songs;
                hasNextPage = songs.length === LIMIT;

                if (songs.length > 0) {
                    appendSongs(songs);
                }

                if (!hasNextPage) {
                    loadingMoreEl.style.display = 'none';
                    noMoreEl.style.display = 'block';
                }
            } catch (error) {
                console.error(error);
                loadingMoreEl.textContent = `Load failed: ${error.message}`;
                loadingMoreEl.style.color = 'red';
            } finally {
                isLoading = false;
                if (hasNextPage) {
                    loadingMoreEl.style.display = 'none';
                }
            }
        }

        function appendSongs(songs) {
            songs.forEach(song => {
                const name = song.name || 'Unknown';
                const id = song.id || '';
                const artists = song.ar && Array.isArray(song.ar)
                    ? song.ar.map(artist => artist.name).join(' / ')
                    : 'Unknown';
                const album = song.al?.name || 'Unknown';

                const songUrl = id ? `https://music.163.com/#/song?id=${id}` : 'javascript:void(0)';

                const row = document.createElement('tr');
                row.innerHTML = `
          <td><a href="${songUrl}" target="_blank">${name}</a></td>
          <td>${artists}</td>
          <td>${album}</td>
        `;
                tableBody.appendChild(row);
            });
        }
    </script>
</body>

</html>
