<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist</title>
    <style>
        .w {
            max-width: 640px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            padding: 12px;
            margin: 0;
            padding-bottom: 60px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back {
            display: flex;
            padding: 12px 0;
            gap: 12px;
            justify-content: space-between;
            font-size: 16px;
        }

        a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        a:hover {
            text-decoration: underline;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 500px;
        }

        th,
        td {
            padding: 10px 1px;
            text-align: left;
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th:nth-child(1),
        td:nth-child(1) {
            width: 50%;
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 25%;
        }

        th:nth-child(3),
        td:nth-child(3) {
            width: 25%;
        }

        th {
            font-weight: bold;
        }

        .loading,
        .loading-more {
            text-align: center;
            padding: 20px 0;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
                padding-bottom: 60px;
            }

            .back {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            th,
            td {
                padding: 8px 1px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="w">
        <div class="container">
            <div class="back">
                <a href="..">..</a>
            </div>
            <h1>Playlist</h1>

            <div id="fixed-player" style="
                position: fixed;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 600px;
                padding: 8px;
                z-index: 1000;
            ">
                <audio id="main-audio" controls style="width: 100%; height: 40px;">
                    Your browser does not support the audio element.
                </audio>
            </div>

            <div class="table-wrapper">
                <table id="song-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Singer</th>
                            <th>Album</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
            </div>

            <div id="loading-more" class="loading-more" style="display:none;">Loading more...</div>
            <div id="no-more" class="loading-more" style="display:none;">No more songs</div>
        </div>
    </div>

    <script>
        const PLAYLIST_ID = '327175538';
        const LIMIT = 30;
        let currentPage = 0;
        let hasNextPage = true;
        let isLoading = false;

        const API_BASE = 'https://apis.netstart.cn/music/playlist/track/all';
        const tableBody = document.getElementById('table-body');
        const loadingMoreEl = document.getElementById('loading-more');
        const noMoreEl = document.getElementById('no-more');
        const mainAudio = document.getElementById('main-audio');

        let currentSongIndex = -1;
        let currentlyPlayingLink = null; // 当前正在播放的 .song-link 元素

        // 播放下一首的通用函数（支持失败重试）
        async function playSongAtIndex(index) {
            const row = tableBody.children[index];
            if (!row) return false;

            const link = row.querySelector('.song-link');
            if (!link) return false;

            const id = link.getAttribute('data-id');
            if (!id) return false;

            // 保存原始文本（用于恢复）
            if (!link.hasAttribute('data-original-name')) {
                link.setAttribute('data-original-name', link.textContent);
            }

            // 恢复上一首样式
            if (currentlyPlayingLink) {
                currentlyPlayingLink.style.color = '';
                currentlyPlayingLink.style.opacity = '';
            }

            // 设置当前为“播放中”状态：灰色
            link.textContent = 'Loading...';
            link.style.color = '#888'; // 灰色
            link.style.opacity = '0.8';

            try {
                const url = await getMusicUrl(id, 'standard');
                if (url) {
                    mainAudio.src = url;
                    await mainAudio.play();
                    // 播放成功：显示原名，保持灰色表示正在播放
                    link.textContent = link.getAttribute('data-original-name');
                    link.style.color = '#888';
                    link.style.opacity = '1';
                    currentlyPlayingLink = link;
                    currentSongIndex = index;
                    return true;
                } else {
                    // URL 获取失败
                    throw new Error('No valid URL');
                }
            } catch (err) {
                alert('Failed to play this song');
                console.warn('Failed to play song at index', index, err);
                // 恢复文本
                link.textContent = link.getAttribute('data-original-name');
                link.style.color = '';
                link.style.opacity = '';
                currentlyPlayingLink = null;
                return false;
            }
        }

        async function tryPlayNextFrom(currentIndex) {
            const total = tableBody.children.length;
            let attempts = 0;
            let nextIndex = currentIndex + 1;

            while (attempts < total) {
                if (nextIndex >= total) {
                    console.log('Reached end of playlist.');
                    return;
                }

                const success = await playSongAtIndex(nextIndex);
                if (success) {
                    return;
                }
                nextIndex++;
                attempts++;
            }
            console.log('No playable songs found after index', currentIndex);
        }

        loadNextPage();

        window.addEventListener('scroll', () => {
            if (!hasNextPage || isLoading) return;
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
                loadNextPage();
            }
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                document.querySelectorAll('.song-link').forEach(link => {
                    const original = link.getAttribute('data-original-name');
                    if (original) {
                        link.textContent = original;
                        link.style.opacity = '';
                        link.style.color = '';
                    }
                });
            }
        });

        async function loadNextPage() {
            if (isLoading || !hasNextPage) return;

            isLoading = true;
            loadingMoreEl.style.display = 'block';
            noMoreEl.style.display = 'none';

            currentPage += 1;
            const offset = (currentPage - 1) * LIMIT;
            const url = `${API_BASE}?id=${PLAYLIST_ID}&limit=${LIMIT}&offset=${offset}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network request failed');

                const data = await response.json();
                if (!data || !Array.isArray(data.songs)) {
                    throw new Error('Invalid response format');
                }

                const songs = data.songs;
                hasNextPage = songs.length === LIMIT;

                if (songs.length > 0) {
                    appendSongs(songs);
                }

                if (!hasNextPage) {
                    loadingMoreEl.style.display = 'none';
                    noMoreEl.style.display = 'block';
                }
            } catch (error) {
                console.error(error);
                loadingMoreEl.textContent = `Load failed: ${error.message}`;
                loadingMoreEl.style.color = 'red';
            } finally {
                isLoading = false;
                if (hasNextPage) {
                    loadingMoreEl.style.display = 'none';
                }
            }
        }

        function appendSongs(songs) {
            songs.forEach(song => {
                const name = song.name || 'Unknown';
                const id = song.id || '';
                const artists = song.ar && Array.isArray(song.ar)
                    ? song.ar.map(artist => artist.name).join(' / ')
                    : 'Unknown';
                const album = song.al?.name || 'Unknown';

                const row = document.createElement('tr');
                row.innerHTML = `
                <td><a href="javascript:void(0)" class="song-link" data-id="${id}">${name}</a></td>
                <td>${artists}</td>
                <td>${album}</td>
            `;
                tableBody.appendChild(row);
            });
        }

        tableBody.addEventListener('click', async function (e) {
            if (e.target.classList.contains('song-link')) {
                e.preventDefault();
                const row = e.target.closest('tr');
                const index = Array.from(tableBody.children).indexOf(row);
                if (index === -1) return;

                await playSongAtIndex(index);
            }
        });

        // 音频播放结束：自动播放下一首
        mainAudio.addEventListener('ended', () => {
            tryPlayNextFrom(currentSongIndex);
        });

        async function getMusicUrlByWyapi(id, level = 'standard') {
            const apiUrl = 'https://wyapi.toubiec.cn/api/music/url';
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: String(id), level })
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                    alert("Some errors occurred in the api server.")
                    return 
                }
                const data = await response.json();
                if (data.code === 200 && data.data?.[0]?.url) {
                    return data.data[0].url;
                } else {
                    throw new Error(data.msg || 'No URL returned');
                }
            } catch (error) {
                console.error('getMusicUrl error:', error);
                return null;
            }
        }

        async function getMusicUrlByNxvav(id) {
            const apiUrl = 'https://api.nxvav.cn/api/music/?type=url&id=';
            try {
                const response = await fetch(apiUrl + id);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.url;
                return data
            } catch (error) {
                console.error('getMusicUrl error:', error);
                return null;
            }
        }

        async function getMusicUrl(id) {
            return getMusicUrlByWyapi(id)
        }
    </script>
</body>

</html>
