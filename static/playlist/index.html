<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="w">
        <div class="container">
            <div class="back">
                <a href="..">..</a>
            </div>
            <h1>Playlist</h1>
            <div id="fixed-player" style="
                position: fixed;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 600px;
                padding: 8px;
                z-index: 1000;
            ">
                <audio id="main-audio" controls style="width: 100%; height: 40px;">
                    Your browser does not support the audio element.
                </audio>
            </div>

            <div class="table-wrapper">
                <table id="song-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Singer</th>
                            <th>Album</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
            </div>

            <div id="loading-more" class="loading-more" style="display:none;">Loading more...</div>
            <div id="no-more" class="loading-more" style="display:none;">No more songs</div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
